# CSH Tutorial Bot — Render Free Web Service deployment config
services:
  - type: web
    name: csh-tutorial-bot
    env: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: TELEBIRR_NUMBER
        sync: false
      - key: CBE_ACCOUNT
        sync: false
      - key: ACCOUNT_HOLDER_NAME
        sync: false
      - key: PRIVATE_CHANNEL_ID
        sync: false
